  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let names = store.get('vetor_nomes_v1') || {};     // chave do rosto -> nome
let merges = store.get('vetor_uniao_v1') || [];    // [[chaveA, chaveB], ...]

function topbar() {
  return el('header', { class: 'top' },
    el('a', { class: 'brand', href: '#', html: LOGO + '<div><b>Vetor Digital</b><span>Galeria</span></div>' }));
}

function folderCard(href, nome, desc, n) {
  return el('a', { class: 'folder', href },
    el('span', { class: 'count' }, plural(n)),
    el('span', { class: 'name' }, nome),
    el('span', { class: 'desc' }, desc));
}

function notice() {
  return el('div', { class: 'notice', html: ICON_INFO },
    el('div', {}, el('b', {}, 'Download livre. '), 'Toque numa foto para abrir e baixar. Na aba Pessoas você encontra todas as fotos de cada atleta.'));
}

function viewHome() {
  const out = [topbar()];
  out.push(el('div', { class: 'head' }, el('h1', {}, 'Pastas'), el('p', { class: 'lead' }, 'Escolha uma pasta, veja as fotos e baixe as suas.')));
  const folders = el('div', { class: 'folders' });
  DATA.clientes.forEach(c => c.pastas.forEach(p => folders.append(folderCard('#' + c.id + '-' + p.id.toLowerCase(), p.nome, p.descricao, fotosDe(c.id, p.id).length))));
  out.push(folders);
  return out;
}

function tabs(c, pasta, ativa) {
  const base = '#' + c.id + '-' + pasta.id.toLowerCase();
  const a1 = el('a', { href: base }, 'Fotos');
  const a2 = el('a', { href: base + '-pessoas' }, 'Pessoas');
  (ativa === 'fotos' ? a1 : a2).setAttribute('aria-current', 'page');
  return el('nav', { class: 'tabs', 'aria-label': 'Ver por' }, a1, a2);
}

function creditBlock(c) {
  return el('div', { class: 'credit' }, el('span', { class: 'mono' }, 'R'), el('div', {}, el('small', {}, 'Fotografado por'), el('b', {}, c.credito + ' | Filmmaker')));
}

function photoGrid(list) {
  const grid = el('div', { class: 'grid' });
  list.forEach((f, i) => {
    const img = el('img', { src: f.thumb || f.src, width: f.w, height: f.h, alt: 'Foto ' + f.codigo, loading: 'lazy' });
    grid.append(el('button', { class: 'ph', 'aria-label': 'Abrir foto ' + f.codigo, onclick: () => openLb(i) }, img, el('span', { class: 'tag' }, f.codigo)));
  });
  return grid;
}

function viewGaleria(c, pasta) {
  const fotos = fotosDe(c.id, pasta.id);
  current = fotos;
  const out = [topbar()];
  out.push(el('div', { class: 'head' }, el('h1', {}, pasta.nome), el('p', { class: 'lead' }, plural(fotos.length) + ' · ' + pasta.descricao)));
  out.push(creditBlock(c));
  out.push(tabs(c, pasta, 'fotos'));
  out.push(notice());
  if (!fotos.length) {
    out.push(el('div', { class: 'empty' }, el('b', {}, 'Ainda não há fotos aqui'), 'As fotos aparecem nesta pasta assim que forem publicadas.'));
    return out;
  }
  out.push(photoGrid(fotos));
  return out;
}

/* ---------- pessoas (agrupamento por rosto, roda no aparelho) ---------- */
const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js';
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
const THRESH = 0.55;   // distância máxima para considerar a mesma pessoa
const MIN_FACE = 48;   // ignora rostos muito pequenos (px)
const FACE = { status: 'idle', progress: 0, msg: '', faces: [], people: [] };

function dist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); }
function clusterFaces(list, thresh) {
  let cl = list.map((_, i) => [i]);
  const D = (A, B) => { let s = 0; for (const i of A) for (const j of B) s += dist(list[i].desc, list[j].desc); return s / (A.length * B.length); };
  while (cl.length > 1) {
    let best = Infinity, bi = -1, bj = -1;
    for (let i = 0; i < cl.length; i++) for (let j = i + 1; j < cl.length; j++) {
      const d = D(cl[i], cl[j]); if (d < best) { best = d; bi = i; bj = j; }
    }
    if (best >= thresh) break;
    cl[bi] = cl[bi].concat(cl[bj]); cl.splice(bj, 1);
  }
  return cl;
}
function buildPeople() {
  const cl = clusterFaces(FACE.faces, THRESH);
  const keyToCl = {}; cl.forEach((c, ci) => c.forEach(fi => { keyToCl[FACE.faces[fi].key] = ci; }));
  const parent = cl.map((_, i) => i);
  const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  merges.forEach(([a, b]) => { if (keyToCl[a] !== undefined && keyToCl[b] !== undefined) parent[find(keyToCl[a])] = find(keyToCl[b]); });
  const groups = {};
  cl.forEach((c, ci) => { const r = find(ci); (groups[r] = groups[r] || []).push(...c); });
  FACE.people = Object.values(groups).map(fidx => {
    const photos = [...new Set(fidx.map(i => FACE.faces[i].f))].sort((a, b) => a - b);
    const cover = fidx.slice().sort((a, b) => FACE.faces[b].w - FACE.faces[a].w)[0];
    const id = fidx.map(i => FACE.faces[i].key).sort()[0];
    return { id, keys: fidx.map(i => FACE.faces[i].key), photos, crop: FACE.faces[cover].crop, name: names[id] || '' };
  }).sort((a, b) => b.photos.length - a.photos.length || (a.id < b.id ? -1 : 1));
  FACE.people.forEach((p, i) => { p.n = i + 1; p.label = p.name || ('Pessoa ' + (i + 1)); });
}
function loadLib() {
  return new Promise((res, rej) => {
    if (window.faceapi) return res();
    const s = document.createElement('script'); s.src = FACE_LIB; s.onload = res; s.onerror = () => rej(new Error('lib'));
    document.head.appendChild(s);
  });
}
function setProgress(p) {
  FACE.progress = p;
  const b = document.getElementById('faceBar'); if (b) b.style.width = Math.round(p * 100) + '%';
  const t = document.getElementById('faceTxt'); if (t) t.textContent = Math.round(p * DATA.fotos.length) + ' de ' + DATA.fotos.length + ' fotos';
}
async function analisar() {
  if (FACE.status === 'running' || FACE.status === 'done') return;
  FACE.status = 'running'; FACE.msg = '';
  const fotos = DATA.fotos;
  const cacheKey = 'vetor_rostos_v1:' + fotos.map(f => f.codigo).join(',');
  try {
    const cached = store.get(cacheKey);
    if (cached && cached.length) { FACE.faces = cached; }
    else {
      await loadLib();
      await faceapi.tf.ready();
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      const faces = [];
      for (let k = 0; k < fotos.length; k++) {
        const f = fotos[k];
        const img = new Image(); img.src = f.src; await img.decode();
        const res = await faceapi.detectAllFaces(img, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.6 }))
                                 .withFaceLandmarks().withFaceDescriptors();
        res.forEach((r, n) => {
          const b = r.detection.box;
          if (b.width < MIN_FACE) return;
          const s = Math.max(b.width, b.height) * 1.5, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
          const cv = document.createElement('canvas'); cv.width = cv.height = 112;
          cv.getContext('2d').drawImage(img, cx - s / 2, cy - s / 2, s, s, 0, 0, 112, 112);
          faces.push({ f: f.i, key: f.codigo + ':' + n, w: b.width, desc: Array.from(r.descriptor), crop: cv.toDataURL('image/jpeg', 0.8) });
        });
        setProgress((k + 1) / fotos.length);
      }
      FACE.faces = faces;
      store.set(cacheKey, faces);
    }
    buildPeople(); FACE.status = 'done';
  } catch (e) {
    FACE.status = 'error';
    FACE.msg = (e && e.message === 'lib')
      ? 'Não consegui carregar o reconhecimento de rostos. Ele precisa de internet na primeira vez.'
      : 'Algo deu errado ao analisar os rostos' + (e && e.message ? ': ' + e.message : '.');
  }
  if (/pessoas/.test(location.hash)) route();
}
function nomear(p, nome) { names[p.id] = nome.trim(); store.set('vetor_nomes_v1', names); buildPeople(); }

function peopleHeader(c, pasta, titulo, lead) {
  return [topbar(),
    el('div', { class: 'head' }, el('h1', {}, titulo), el('p', { class: 'lead' }, lead))];
}

function viewPessoas(c, pasta) {
  const base = '#' + c.id + '-' + pasta.id.toLowerCase();
  const out = peopleHeader(c, pasta, 'Pessoas', 'Todas as fotos de cada atleta, reunidas pelo rosto.');
  out.push(tabs(c, pasta, 'pessoas'));
  if (FACE.status === 'idle') setTimeout(analisar, 0);
  if (FACE.status === 'idle' || FACE.status === 'running') {
    out.push(el('div', { class: 'status', html: '<b>Procurando rostos…</b><br>Isso roda no seu aparelho; as fotos não saem daqui. Na primeira vez demora um pouco.<div class="bar"><i id="faceBar"></i></div><div id="faceTxt" style="margin-top:6px;font-size:12.5px"></div>' }));
    setTimeout(() => setProgress(FACE.progress), 0);
    return out;
  }
  if (FACE.status === 'error') {
    out.push(el('div', { class: 'status' }, FACE.msg, el('div', { style: 'margin-top:12px' },
      el('button', { class: 'btn', onclick: () => { FACE.status = 'idle'; route(); } }, 'Tentar de novo'))));
    return out;
  }
  out.push(el('div', { class: 'status' }, el('b', {}, FACE.people.length + (FACE.people.length === 1 ? ' pessoa' : ' pessoas')), ' encontradas. Toque em uma para ver as fotos dela e dar um nome. Se a mesma pessoa aparecer duas vezes, use “É a mesma pessoa que…” dentro do perfil.'));
  const g = el('div', { class: 'people' });
  FACE.people.forEach(p => {
    g.append(el('a', { class: 'pp', href: base + '-pessoas-' + p.n },
      el('img', { src: p.crop, alt: p.label }), el('div', { class: 'nm' }, p.label), el('div', { class: 'ct' }, plural(p.photos.length))));
  });
  out.push(g);
  return out;
}

function viewPessoa(c, pasta, n) {
  const base = '#' + c.id + '-' + pasta.id.toLowerCase();
  if (FACE.status !== 'done') { location.hash = base + '-pessoas'; return viewPessoas(c, pasta); }
  const p = FACE.people.find(x => x.n === n);
  if (!p) { location.hash = base + '-pessoas'; return viewPessoas(c, pasta); }
  const lista = p.photos.map(i => DATA.fotos[i]);
  current = lista;
  const out = [topbar()];
  const inp = el('input', { placeholder: 'Nome (ex.: João)', maxlength: '40', 'aria-label': 'Nome da pessoa' });
  inp.value = p.name;
  inp.addEventListener('change', () => { nomear(p, inp.value); toast('Nome salvo neste aparelho.'); route(); });
  out.push(el('div', { class: 'phead' }, el('img', { src: p.crop, alt: '' }), el('div', { style: 'flex:1;min-width:0' }, inp, el('small', {}, plural(lista.length)))));
  const row = el('div', { class: 'row' });
  row.append(el('button', { class: 'btn', html: ICON_DL, onclick: () => baixarVarias(lista) }, 'Baixar todas (' + lista.length + ')'));
  if (FACE.people.length > 1) {
    const sel = el('select', { class: 'btn ghost', 'aria-label': 'Juntar com outra pessoa' }, el('option', { value: '' }, 'É a mesma pessoa que…'));
    FACE.people.filter(x => x.id !== p.id).forEach(x => sel.append(el('option', { value: x.id }, x.label)));
    sel.addEventListener('change', () => {
      if (!sel.value) return;
      const outra = FACE.people.find(x => x.id === sel.value);
      const nome = p.name || (outra && outra.name) || '';
      merges.push([p.id, sel.value]); store.set('vetor_uniao_v1', merges);
      buildPeople();
      const novo = FACE.people.find(x => x.keys.includes(p.id));
      if (novo && nome && !novo.name) { nomear(novo, nome); }
      const alvoHash = base + '-pessoas-' + (novo ? novo.n : 1);
      if (location.hash.toLowerCase() === alvoHash.toLowerCase()) route(); else location.hash = alvoHash;
    });
    row.append(sel);
  }
  out.push(row);
  out.push(photoGrid(lista));
  return out;
}

const ICON_IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>';
const INSTAGRAMS = [
  { handle: 'vetordigital.lp', url: 'https://www.instagram.com/vetordigital.lp/' },
  { handle: 'rayon_videomaker', url: 'https://www.instagram.com/rayon_videomaker/' }
];
function footer() {
  return el('footer', { class: 'foot' }, INSTAGRAMS.map(i =>
    el('a', { class: 'ig', href: i.url, target: '_blank', rel: 'noopener', html: ICON_IG }, '@' + i.handle)));
}

function route() {
  closeLb();
  const h = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
  const [cid, sub, ext, num] = h.split('-');
  const c = clienteById(cid);
  let nodes;
  if (!h || !c) nodes = viewHome();
  else if (!sub) nodes = viewHome();
  else {
    const p = c.pastas.find(p => p.id.toLowerCase() === sub);
    if (!p) nodes = viewHome();
    else if (ext === 'pessoas') nodes = num ? viewPessoa(c, p, parseInt(num, 10)) : viewPessoas(c, p);
    else nodes = viewGaleria(c, p);
  }
  app.replaceChildren(...nodes, footer());
  window.scrollTo(0, 0);
}

/* download livre */
async function baixar(f) {
  const nome = f.codigo + '.jpg';
  try {
    const blob = await (await fetch(f.src)).blob();
    const file = new File([blob], nome, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
      await navigator.share({ files: [file] }); return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    window.open(f.src, '_blank');
  }
}
async function baixarVarias(lista) {
  toast('Baixando ' + lista.length + ' fotos…');
  for (const f of lista) { await baixar(f); await new Promise(r => setTimeout(r, 600)); }
}
function actionFor(f) {
  document.getElementById('lbCredit').textContent = 'Foto por ' + clienteById(f.cliente).credito + ' | Filmmaker';
  return el('button', { class: 'btn', html: ICON_DL, onclick: () => baixar(f) }, 'Baixar foto');
}
let tt;
function toast(t) {
  const n = document.getElementById('toast');
  n.textContent = t; n.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => { n.hidden = true; }, 3500);
}

/* visualizador */
function openLb(i) { idx = i; lb.hidden = false; document.body.style.overflow = 'hidden'; showLb(); document.getElementById('lbClose').focus(); }
function closeLb() { if (lb.hidden) return; lb.hidden = true; document.body.style.overflow = ''; }
function showLb() {
  const f = current[idx];
  if (!f) return;
  document.getElementById('lbImg').src = f.src;
  document.getElementById('lbImg').alt = 'Foto ' + f.codigo;
  const code = document.getElementById('lbCode');
  code.replaceChildren(f.codigo, el('small', {}, (idx + 1) + ' de ' + current.length));
  document.getElementById('lbAction').replaceChildren(actionFor(f));
  const chips = document.getElementById('lbChips'); chips.replaceChildren();
  if (FACE.status === 'done') {
    FACE.people.filter(p => p.photos.includes(f.i)).forEach(p => {
      chips.append(el('a', { class: 'chip', href: '#' + f.cliente + '-' + f.pasta.toLowerCase() + '-pessoas-' + p.n }, el('img', { src: p.crop, alt: '' }), p.label));
    });
  }
  const many = current.length > 1;
  document.getElementById('lbPrev').hidden = !many;
  document.getElementById('lbNext').hidden = !many;
}
function step(d) { idx = (idx + d + current.length) % current.length; showLb(); }
document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', () => step(-1));
document.getElementById('lbNext').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

window.addEventListener('hashchange', route);
route();
</script>
